<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Dristi Foundation homepage loading preview using accessible CSS skeletons."
    />
    <title>Loading — Dristi Foundation</title>
    <style>
      :root {
        color-scheme: light;
        --page-background: #f9fafb;
        --surface-background: #ffffff;
        --section-background: #f9fafb;
        --text-color: #111827;
        --muted-color: #6b7280;
        --line-color: #e5e7eb;
        --skeleton-base: #e5e7eb;
        --skeleton-shimmer: rgba(255, 255, 255, 0.28);
        --skeleton-highlight: rgba(255, 255, 255, 0.62);
        --skeleton-speed: 1.8s;
        --indigo-700: #4338ca;
        --indigo-800: #3730a3;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--page-background);
        color: var(--text-color);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .site-header {
        position: relative;
        z-index: 1;
        background: var(--surface-background);
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06);
      }

      .header-inner,
      .content-width {
        width: min(100% - 32px, 1280px);
        margin: 0 auto;
      }

      .header-inner {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand-skeleton {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 50%;
      }

      .brand-name {
        width: 158px;
        height: 18px;
        border-radius: 6px;
      }

      .nav-skeleton {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .nav-item {
        width: 58px;
        height: 12px;
        border-radius: 6px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 80px 0 88px;
        background: linear-gradient(120deg, var(--indigo-700), var(--indigo-800));
      }

      .hero-content {
        position: relative;
        z-index: 1;
        width: min(100% - 32px, 900px);
        margin: 0 auto;
        text-align: center;
      }

      .hero-kicker {
        width: min(280px, 70%);
        height: 26px;
        margin: 0 auto 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .hero-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .hero-title-line {
        width: min(620px, 88%);
        height: clamp(32px, 6vw, 58px);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.88);
      }

      .hero-title-line--short {
        width: min(440px, 70%);
      }

      .hero-description {
        width: min(540px, 82%);
        height: 16px;
        margin: 0 auto 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.35);
      }

      .hero-description--short {
        width: min(390px, 68%);
        margin-bottom: 30px;
      }

      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .hero-button {
        width: 190px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.94);
      }

      .hero-button--secondary {
        background: rgba(255, 255, 255, 0.12);
      }

      .quick-services {
        padding: 24px 0;
        border-bottom: 1px solid var(--line-color);
        background: var(--surface-background);
      }

      .service-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .service-card {
        display: flex;
        min-height: 82px;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line-color);
        border-radius: 12px;
        background: var(--surface-background);
      }

      .service-icon {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 10px;
        background: #e0e7ff;
      }

      .service-copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 9px;
      }

      .service-title {
        width: 78%;
        height: 12px;
        border-radius: 6px;
      }

      .service-subtitle {
        width: 58%;
        height: 9px;
        border-radius: 5px;
      }

      .section {
        padding: 64px 0;
      }

      .section--muted {
        background: var(--section-background);
      }

      .section-heading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
      }

      .eyebrow {
        width: 110px;
        height: 10px;
        border-radius: 5px;
        background: #c7d2fe;
      }

      .heading-line {
        width: min(300px, 64%);
        height: 28px;
        border-radius: 8px;
      }

      .pillar-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .pillar-card {
        min-height: 220px;
        padding: 28px 24px;
        border: 1px solid #f3f4f6;
        border-radius: 16px;
        background: var(--surface-background);
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05);
      }

      .pillar-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #e0e7ff;
      }

      .pillar-title {
        width: 62%;
        height: 16px;
        margin: 0 auto 14px;
        border-radius: 7px;
      }

      .pillar-copy {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .pillar-copy span {
        width: 100%;
        height: 9px;
        border-radius: 5px;
      }

      .pillar-copy span:last-child {
        width: 72%;
        margin: 0 auto;
      }

      .updates-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }

      .updates-title {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .updates-title .heading-line {
        width: 320px;
        max-width: 72vw;
        margin: 0;
      }

      .view-all {
        width: 110px;
        height: 12px;
        margin-bottom: 6px;
        border-radius: 6px;
      }

      .post-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .post-card {
        overflow: hidden;
        border: 1px solid #f3f4f6;
        border-radius: 16px;
        background: var(--surface-background);
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05);
      }

      .post-image {
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      .post-body {
        padding: 22px;
      }

      .post-date {
        width: 92px;
        height: 10px;
        margin-bottom: 14px;
        border-radius: 5px;
      }

      .post-title {
        width: 88%;
        height: 17px;
        margin-bottom: 14px;
        border-radius: 6px;
      }

      .post-copy {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .post-copy span {
        width: 100%;
        height: 10px;
        border-radius: 5px;
      }

      .post-copy span:last-child {
        width: 68%;
      }

      .cta {
        padding: 58px 16px;
        background: linear-gradient(120deg, var(--indigo-700), var(--indigo-800));
      }

      .cta-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .cta-title {
        width: min(350px, 66%);
        height: 30px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.84);
      }

      .cta-copy {
        width: min(460px, 78%);
        height: 11px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.3);
      }

      .cta-copy--short {
        width: min(340px, 62%);
        margin-bottom: 8px;
      }

      .cta-button {
        width: 220px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.95);
      }

      .site-footer {
        padding: 44px 0 28px;
        background: #111827;
      }

      .footer-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 32px;
      }

      .footer-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .footer-heading {
        width: 150px;
        height: 16px;
        margin-bottom: 6px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.7);
      }

      .footer-line {
        width: 78%;
        height: 10px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.2);
      }

      .footer-line--short {
        width: 56%;
      }

      .footer-bottom {
        height: 1px;
        margin-top: 32px;
        background: rgba(255, 255, 255, 0.14);
      }

      .skeleton {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        background-color: var(--skeleton-base);
      }

      .skeleton::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        background-image: linear-gradient(
          90deg,
          transparent 0%,
          var(--skeleton-shimmer) 25%,
          var(--skeleton-highlight) 50%,
          var(--skeleton-shimmer) 75%,
          transparent 100%
        );
        background-size: 200% 100%;
        animation: skeleton-shimmer var(--skeleton-speed) ease-in-out infinite;
        content: "";
        pointer-events: none;
      }

      .hero .skeleton {
        --skeleton-base: rgba(255, 255, 255, 0.2);
        --skeleton-shimmer: rgba(255, 255, 255, 0.12);
        --skeleton-highlight: rgba(255, 255, 255, 0.3);
      }

      .cta .skeleton {
        --skeleton-base: rgba(255, 255, 255, 0.2);
        --skeleton-shimmer: rgba(255, 255, 255, 0.12);
        --skeleton-highlight: rgba(255, 255, 255, 0.3);
      }

      .footer-column .skeleton {
        --skeleton-base: rgba(255, 255, 255, 0.16);
        --skeleton-shimmer: rgba(255, 255, 255, 0.08);
        --skeleton-highlight: rgba(255, 255, 255, 0.18);
      }

      @keyframes skeleton-shimmer {
        from {
          background-position: -200% 0;
        }

        to {
          background-position: 200% 0;
        }
      }

      @media (max-width: 760px) {
        .header-inner,
        .content-width {
          width: min(100% - 32px, 640px);
        }

        .nav-skeleton {
          gap: 16px;
        }

        .nav-item {
          width: 42px;
        }

        .hero {
          padding: 68px 0 72px;
        }

        .service-grid,
        .pillar-grid,
        .post-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .section {
          padding: 48px 0;
        }

        .pillar-card {
          min-height: 190px;
        }

        .footer-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 480px) {
        .header-inner,
        .content-width {
          width: min(100% - 28px, 420px);
        }

        .brand-name {
          width: 128px;
        }

        .nav-item {
          display: none;
        }

        .menu-mark {
          display: flex;
          width: 36px;
          height: 36px;
          flex-direction: column;
          justify-content: center;
          gap: 5px;
          padding: 8px;
          border: 1px solid var(--line-color);
          border-radius: 8px;
          background: var(--surface-background);
        }

        .menu-mark span {
          height: 2px;
          border-radius: 2px;
        }

        .hero {
          padding: 56px 0 60px;
        }

        .hero-actions {
          align-items: center;
          flex-direction: column;
        }

        .hero-button {
          width: min(240px, 100%);
        }

        .updates-heading {
          align-items: flex-start;
        }

        .view-all {
          width: 72px;
        }

        .footer-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
      }

      @media (min-width: 481px) {
        .menu-mark {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div aria-busy="true" aria-label="Loading Dristi Foundation homepage">
      <header class="site-header">
        <div class="header-inner">
          <div class="brand-skeleton" aria-hidden="true">
            <div class="skeleton brand-mark"></div>
            <div class="skeleton brand-name"></div>
          </div>
          <nav class="nav-skeleton" aria-hidden="true">
            <div class="skeleton nav-item"></div>
            <div class="skeleton nav-item"></div>
            <div class="skeleton nav-item"></div>
            <div class="menu-mark">
              <span class="skeleton"></span>
              <span class="skeleton"></span>
              <span class="skeleton"></span>
            </div>
          </nav>
        </div>
      </header>

      <main>
        <section class="hero" aria-hidden="true">
          <div class="hero-content">
            <div class="skeleton hero-kicker"></div>
            <div class="hero-title">
              <div class="skeleton hero-title-line"></div>
              <div class="skeleton hero-title-line hero-title-line--short"></div>
            </div>
            <div class="skeleton hero-description"></div>
            <div class="skeleton hero-description hero-description--short"></div>
            <div class="hero-actions">
              <div class="skeleton hero-button"></div>
              <div class="skeleton hero-button hero-button--secondary"></div>
            </div>
          </div>
        </section>

        <section class="quick-services" aria-hidden="true">
          <div class="content-width service-grid">
            <div class="service-card">
              <div class="skeleton service-icon"></div>
              <div class="service-copy">
                <div class="skeleton service-title"></div>
                <div class="skeleton service-subtitle"></div>
              </div>
            </div>
            <div class="service-card">
              <div class="skeleton service-icon"></div>
              <div class="service-copy">
                <div class="skeleton service-title"></div>
                <div class="skeleton service-subtitle"></div>
              </div>
            </div>
            <div class="service-card">
              <div class="skeleton service-icon"></div>
              <div class="service-copy">
                <div class="skeleton service-title"></div>
                <div class="skeleton service-subtitle"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="section section--muted" aria-hidden="true">
          <div class="content-width">
            <div class="section-heading">
              <div class="skeleton eyebrow"></div>
              <div class="skeleton heading-line"></div>
            </div>
            <div class="pillar-grid">
              <article class="pillar-card">
                <div class="skeleton pillar-icon"></div>
                <div class="skeleton pillar-title"></div>
                <div class="pillar-copy">
                  <span class="skeleton"></span>
                  <span class="skeleton"></span>
                  <span class="skeleton"></span>
                </div>
              </article>
              <article class="pillar-card">
                <div class="skeleton pillar-icon"></div>
                <div class="skeleton pillar-title"></div>
                <div class="pillar-copy">
                  <span class="skeleton"></span>
                  <span class="skeleton"></span>
                  <span class="skeleton"></span>
                </div>
              </article>
              <article class="pillar-card">
                <div class="skeleton pillar-icon"></div>
                <div class="skeleton pillar-title"></div>
                <div class="pillar-copy">
                  <span class="skeleton"></span>
                  <span class="skeleton"></span>
                  <span class="skeleton"></span>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="section" aria-hidden="true">
          <div class="content-width">
            <div class="updates-heading">
              <div class="updates-title">
                <div class="skeleton eyebrow"></div>
                <div class="skeleton heading-line"></div>
              </div>
              <div class="skeleton view-all"></div>
            </div>
            <div class="post-grid">
              <article class="post-card">
                <div class="skeleton post-image"></div>
                <div class="post-body">
                  <div class="skeleton post-date"></div>
                  <div class="skeleton post-title"></div>
                  <div class="post-copy">
                    <span class="skeleton"></span>
                    <span class="skeleton"></span>
                    <span class="skeleton"></span>
                  </div>
                </div>
              </article>
              <article class="post-card">
                <div class="skeleton post-image"></div>
                <div class="post-body">
                  <div class="skeleton post-date"></div>
                  <div class="skeleton post-title"></div>
                  <div class="post-copy">
                    <span class="skeleton"></span>
                    <span class="skeleton"></span>
                    <span class="skeleton"></span>
                  </div>
                </div>
              </article>
              <article class="post-card">
                <div class="skeleton post-image"></div>
                <div class="post-body">
                  <div class="skeleton post-date"></div>
                  <div class="skeleton post-title"></div>
                  <div class="post-copy">
                    <span class="skeleton"></span>
                    <span class="skeleton"></span>
                    <span class="skeleton"></span>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="cta" aria-hidden="true">
          <div class="cta-inner">
            <div class="skeleton cta-title"></div>
            <div class="skeleton cta-copy"></div>
            <div class="skeleton cta-copy cta-copy--short"></div>
            <div class="skeleton cta-button"></div>
          </div>
        </section>
      </main>

      <footer class="site-footer" aria-hidden="true">
        <div class="content-width">
          <div class="footer-grid">
            <div class="footer-column">
              <div class="skeleton footer-heading"></div>
              <div class="skeleton footer-line"></div>
              <div class="skeleton footer-line footer-line--short"></div>
            </div>
            <div class="footer-column">
              <div class="skeleton footer-heading"></div>
              <div class="skeleton footer-line footer-line--short"></div>
              <div class="skeleton footer-line"></div>
              <div class="skeleton footer-line footer-line--short"></div>
            </div>
            <div class="footer-column">
              <div class="skeleton footer-heading"></div>
              <div class="skeleton footer-line footer-line--short"></div>
              <div class="skeleton footer-line"></div>
              <div class="skeleton footer-line footer-line--short"></div>
            </div>
          </div>
          <div class="footer-bottom"></div>
        </div>
      </footer>
    </div>
  </body>
</html>
